name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: gx_exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Lint check
        run: npm run eslint

      - name: Check for insecure Math.random() in server/financial code
        run: |
          echo "Scanning server/, routes/, workers/ for unsafe Math.random() usage..."
          UNSAFE_MATH=$(grep -rn "Math\.random()" server/ routes/ workers/ 2>/dev/null | grep -v "\.test\." | grep -v "mock" | grep -v "demo" || true)
          if [ -n "$UNSAFE_MATH" ]; then
            echo "::error::Found unsafe Math.random() usages in production server code:"
            echo "$UNSAFE_MATH"
            exit 1
          else
            echo "✅ No unsafe Math.random() found in server financial code."
          fi

      - name: Run test suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/gx_exchange_test
          REDIS_URL: redis://localhost:6379
          TELEGRAM_BOT_TOKEN: test_bot_token_123456789
          USE_MOCK_GIFTS: "true"
        run: npm run test

      - name: Upload test results artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            *.log
          if-no-files-found: ignore
