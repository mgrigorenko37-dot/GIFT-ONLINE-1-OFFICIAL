name: CI

# GitHub Actions CI Workflow for GX Exchange
# 
# Script Mapping Analysis (package.json):
# - typecheck (npm run typecheck): EXECUTED in CI
# - lint (npm run lint / npm run eslint): EXECUTED in CI via 'npm run lint'
# - prettier (npm run prettier): EXECUTED in CI via 'npm run prettier'
# - check:security (npm run check:security): EXECUTED in CI
# - test:unit (npm run test:unit): EXECUTED in CI
# - test:integration (npm run test:integration): EXECUTED in CI (requires PostgreSQL service)
# - build (npm run build): EXECUTED in CI
# - test (npm test): Alias for vitest run; separated into test:unit and test:integration for clear step diagnostics
# - dev / bot / db:migrate / preview / start: Local/runtime/deployment commands, not executed during CI validation
# - prettier fix: Auto-fix utility for local development, not executed in CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: gx_exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gx_exchange_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/gx_exchange_test
      TELEGRAM_BOT_TOKEN: test_bot_token_123456789
      USE_MOCK_GIFTS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck (npm run typecheck)
        run: npm run typecheck

      - name: Lint check (npm run lint)
        run: npm run lint

      - name: Prettier check (npm run prettier)
        run: npm run prettier

      - name: Security & Randomness Audit (npm run check:security)
        run: npm run check:security

      - name: Branding & Repository Integrity Check (npm run check:branding)
        run: npm run check:branding

      - name: Run unit tests (npm run test:unit)
        run: npm run test:unit

      - name: Run integration tests (npm run test:integration)
        run: npm run test:integration

      - name: Production build (npm run build)
        run: npm run build

      - name: Upload test artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            *.log
          if-no-files-found: ignore
