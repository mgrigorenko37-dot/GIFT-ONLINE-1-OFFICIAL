name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: gx_exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gx_exchange_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/gx_exchange_test
      REDIS_URL: redis://localhost:6379
      TELEGRAM_BOT_TOKEN: test_bot_token_123456789
      USE_MOCK_GIFTS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck (npm run typecheck)
        run: npm run typecheck

      - name: Build application (npm run build)
        run: npm run build

      - name: Lint check (npm run lint)
        run: npm run lint

      - name: Run unit tests (npm run test:unit)
        run: npm run test:unit

      - name: Run integration tests (npm run test:integration)
        run: npm run test:integration

      - name: Security & Randomness Audit (npm run check:security)
        run: npm run check:security

      - name: Upload test artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            *.log
          if-no-files-found: ignore
