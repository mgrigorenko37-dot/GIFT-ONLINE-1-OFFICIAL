<!doctype html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.indexOf('ResizeObserver') !== -1 || e.message.indexOf('WebSocket') !== -1)
        )
          return;
        try {
          fetch('/api/log-client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: e.message,
              filename: e.filename,
              lineno: e.lineno,
              error: e.error?.stack || e.error,
            }),
          }).catch(function () {});
        } catch (_) {}
      });
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e.reason && (e.reason.message || e.reason.toString())) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('ResizeObserver') !== -1 ||
          msg.indexOf('analytics') !== -1
        )
          return;
        try {
          fetch('/api/log-client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: e.reason?.message || 'unhandledrejection',
              error: e.reason?.stack || e.reason,
            }),
          }).catch(function () {});
        } catch (_) {}
      });
    </script>

    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="author" content="Cenk SARI" />
    <meta name="copyright" content="Cenk SARI | https://github.com/cenksari" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d15" />
    <meta name="description" content="GX Exchange — trade collectible Telegram gifts" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>GX Exchange</title>
  </head>
  <body style="background-color: #0e0d15; color: #f5f2fc; margin: 0">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
